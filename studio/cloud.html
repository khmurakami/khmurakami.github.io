<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud study</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<!--
  One cumulus on its sky, nothing else: the place to get a cloud right before
  it goes into a scene.

    ?engine=NAME   which way to paint it (see ENGINES below)
    ?seed=N        which cloud
    ?mask=1        the cloud's silhouette only, white on black, for measuring
-->
<canvas id="c"></canvas>
<script src="../js/painter.js"></script>
<script>
    const P = window.Painter;
    const q = new URLSearchParams(location.search);
    const seed = Number(q.get('seed') || 14);
    const c = document.getElementById('c');
    const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    g.scale(dpr, dpr);

    let sky = function (stops) {
        const sg = g.createLinearGradient(0, 0, 0, H);
        for (const [at, col] of stops) sg.addColorStop(at, col);
        g.fillStyle = sg;
        g.fillRect(0, 0, W, H);
    };
    const paper = P.paper(256, 5);
    // Fine, even grain, like film: one random value per pixel.
    const film = (() => {
        const t = document.createElement('canvas');
        t.width = t.height = 192;
        const tg = t.getContext('2d');
        const im = tg.createImageData(192, 192);
        const r = P.rng(77);
        for (let i = 0; i < im.data.length; i += 4) {
            const v = 128 + (r() - 0.5) * 120;
            im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
            im.data[i + 3] = 255;
        }
        tg.putImageData(im, 0, 0);
        return t;
    })();
    const brush = P.brushTexture(512, 9);

    // The same grown cloud for every banded style, so they compare fairly.
    function grown(r) {
        return P.growCloud(r, { cx: W * 0.5, baseY: H * 0.97, width: Math.min(W * 0.62, H * 0.8), height: H * 0.84, lean: 0.15 });
    }

    // Our own directions. Each is a whole look: a sky and a way of painting.
    const STYLES = {
        // Cut paper: each lobe a layer that casts a soft shadow on the layer behind.
        kirie: {
            sky: [[0, '#2a3fb8'], [0.55, '#3d6fe0'], [1, '#a7dcef']],
            cloud: {
                tones: ['#fffaf1', '#f2e8db', '#cdd3f0', '#a3afe6', '#7a86d6'],
                offsets: [0.1, 0.24, 0.42, 0.66], shift: [0.3, 1], wobble: 0.012,
                haze: { color: '#7f95e8', amount: 0.22 }, bounce: { tone: '#9097dd', offset: 0.95 },
                cast: { color: 'rgba(28,30,92,0.35)', blur: 5, x: 2, y: 3 },
                texture: paper, textureAlpha: 0.35
            }
        },
        // Warm light, cool shade: an afternoon turning toward evening.
        gouache: {
            sky: [[0, '#2c62cf'], [0.6, '#5aa2e6'], [1, '#f3d3b6']],
            cloud: {
                tones: ['#fff3df', '#ffdcbc', '#d8c6e6', '#a6a8e2', '#7b80d2'],
                offsets: [0.12, 0.28, 0.46, 0.7], shift: [0.35, 1], wobble: 0.03,
                haze: { color: '#7fb0ea', amount: 0.2 }, bounce: { tone: '#b49bd6', offset: 0.98 },
                soften: 2, softenMix: 0.22, texture: brush, textureAlpha: 0.6
            }
        },
        // Ink contours over flat washes.
        ink: {
            sky: [[0, '#3a78e0'], [1, '#7fb3ef']],
            cloud: {
                tones: ['#ffffff', '#dfeafc', '#b8d0f6', '#93b5ef', '#77a0e8'],
                offsets: [0.12, 0.27, 0.45, 0.68], shift: [0.3, 1], wobble: 0.02,
                haze: { color: '#8db8f0', amount: 0.2 }, bounce: { tone: '#8aaced', offset: 0.97 },
                ink: { color: '#2c4294', width: 0.1 },
                texture: paper, textureAlpha: 0.3
            }
        },
        // A faded summer photograph: warm whites, cyan-grey shade, grain.
        showa: {
            sky: [[0, '#3f7fb8'], [0.6, '#79acd0'], [1, '#d6e2d2']],
            cloud: {
                tones: ['#f9f4e6', '#e8e4d6', '#bfcad6', '#97abc6', '#7189ae'],
                offsets: [0.09, 0.22, 0.4, 0.64], shift: [0.35, 1], wobble: 0.025,
                haze: { color: '#a9c6da', amount: 0.25 }, bounce: { tone: '#a3b2c6', offset: 0.96 },
                soften: 3, softenMix: 0.3, texture: paper, textureAlpha: 0.2
            },
            after() {
                const glow = P.layer(W, H, dpr);
                glow.g.drawImage(c, 0, 0, W, H);
                P.bloom(g, glow.canvas, { radius: 30, alpha: 0.25, w: W, h: H });
                P.grain(g, film, W, H, { alpha: 0.06, mode: 'overlay', keepAlpha: false });
            }
        }
    };

    // Engines: each turns a seed into a painted frame. ?engine=NAME picks one,
    // so approaches can be tried and scored side by side.
    const ENGINES = {
        // The earlier approach: lit spheres cut into tone bands.
        lit(r) {
            sky([[0, '#1a5cef'], [0.65, '#2a74f4'], [1, '#5b98f7']]);
            const width = Math.min(W * 0.55, H * 0.66);
            const tower = P.cloud(P.cumulusBillows(r, W * 0.5, H * 0.97, width * 1.25, H * 0.85), {
                dpr, seed, flatBase: H * 0.97, detail: 2, shadeBase: 0.5,
                light: [-0.35, -0.9, 0.3], blend: 0.45, ao: 0.6, aoRadius: 0.6, rim: 0,
                cuts: [0.16, 0.45, 0.53, 0.62], brush: 0.05, brushFreq: 0.03
            });
            drawCloud(tower);
        }
    };
    for (const [name, style] of Object.entries(STYLES)) {
        ENGINES[name] = (r) => {
            sky(style.sky);
            const cl = P.paintCloud(grown(r), { ...style.cloud, flatBase: H * 0.97 }, { dpr, seed });
            drawCloud(cl);
            if (style.after) style.after();
        };
    }

    // Mask mode: every engine draws its cloud through drawCloud, which here
    // paints the silhouette instead, and skies and after-effects are skipped.
    const MASK = q.has('mask');
    function drawCloud(cl) {
        if (!MASK) { g.drawImage(cl.canvas, cl.x, cl.y, cl.w, cl.h); return; }
        const m = P.layer(W, H, dpr);
        m.g.drawImage(cl.canvas, cl.x, cl.y, cl.w, cl.h);
        m.g.globalCompositeOperation = 'source-in';
        m.g.fillStyle = '#fff';
        m.g.fillRect(0, 0, W, H);
        g.drawImage(m.canvas, 0, 0, W, H);
    }
    if (MASK) {
        sky = () => { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); };
        for (const st of Object.values(STYLES)) delete st.after;
    }

    const engineName = ENGINES[q.get('engine')] ? q.get('engine') : 'kirie';
    const t0 = performance.now();
    ENGINES[engineName](P.rng(seed));
    document.title = `Cloud study: ${engineName} (${Math.round(performance.now() - t0)} ms)`;
</script>
</body>
</html>
