<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

</head>
<body>
    <canvas id="plan" aria-label="Plan of a house. Each room is a work: hover or use the arrow keys to stand a room up, Enter or click to go in."></canvas>

    <!-- The drawing's title block, in place of a header. -->
    <aside class="titleblock">
        <div class="tb-head">
            <span class="seal" aria-hidden="true">村上</span>
            <div>
                <h1>Residence of khmurakami</h1>
                <p>A playground: one portfolio, shown many ways.</p>
            </div>
        </div>
        <dl class="tb-grid">
            <div><dt class="mono">Scale</dt><dd>1 : 50</dd></div>
            <div><dt class="mono">Sheet</dt><dd>01 / 01</dd></div>
            <div><dt class="mono">Drawn</dt><dd><time id="drawn"></time></dd></div>
        </dl>
        <div class="tb-here"><span class="mono">You are here</span><span id="here">The house</span></div>
        <div class="tb-revs"><table class="revs">
            <caption class="mono">Revisions</caption>
            <tbody>
                <tr><td>A</td><td>2026.11</td><td><a href="room/">Tatami Room</a></td></tr>
                <tr class="planned"><td>B</td><td>—</td><td>Room B, planned</td></tr>
                <tr class="planned"><td>C</td><td>—</td><td>Room C, planned</td></tr>
            </tbody>
        </table></div>
        <div class="tb-foot mono">
            <span id="how">Hover a room · scroll · drag</span>
            <a href="https://github.com/khmurakami" rel="noopener noreferrer">GitHub ↗</a>
        </div>
    </aside>

    <!-- A room, once you've gone to it: what it is, and the two ways on. -->
    <section id="room-panel" hidden aria-live="polite">
        <div class="head"><span class="n mono"></span><h2 class="t"></h2></div>
        <img alt="" width="1440" height="900" decoding="async">
        <p class="l"></p>
        <p class="m mono"></p>
        <div class="actions">
            <button type="button" class="in">Step in <span aria-hidden="true">→</span></button>
            <button type="button" class="back"><span aria-hidden="true">←</span> Back to the house</button>
        </div>
    </section>

    <div id="lids" aria-hidden="true"><i></i><i></i></div>

    <nav class="visually-hidden" aria-label="Works">
        <ul><li><a href="room/">01 · Tatami Room: my projects as things in a pixel-art room</a></li></ul>
    </nav>

    <script type="module" src="js/playground/plan.js?v=20261124-1119"></script>
    <script type="module" src="js/playground/today.js?v=20261124-1119"></script>
</body>
</html>
