<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Isometric Portfolio & Blog</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13141f;
            --text-primary: #f0e6c8;
            --text-secondary: #a0a0b0;
            --accent: #ff715b;
            --glass-bg: rgba(18, 18, 27, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d1022;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-primary);
        }

        /* ── Layer 1: Full-screen forest exterior — pinned to the entire viewport ── */
        #bg-forest {
            position: fixed;
            inset: 0;
            width: 110%;
            height: 110%;
            left: -5%;
            top: -5%;
            background: url('assets/full_screen_background_github_page.jpg') center center / cover no-repeat;
            will-change: transform;
            transition: transform 0.08s ease-out;
            image-rendering: pixelated;
        }

        /* ── Layer 2: Subtle dark vignette so the edges feel like night ── */
        #vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(5, 6, 18, 0.65) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* ── Header: Professional Navigation ── */
        header#main-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 3rem;
            z-index: 1000;
            pointer-events: none;
        }

        .brand h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--text-primary);
            line-height: 1;
            pointer-events: auto;
        }

        .brand h1 span {
            color: var(--accent);
        }

        .brand p {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        nav#top-nav {
            display: flex;
            gap: 2rem;
            pointer-events: auto;
        }

        nav#top-nav a {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav#top-nav a:hover, nav#top-nav a.active {
            color: var(--accent);
        }

        /* ── Layer 3: The cozy room + hitboxes — centered, 75vw on desktop ── */
        #game-container {
            position: relative;
            z-index: 3;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
            transition: transform 0.12s ease-out;
            perspective: 1000px;
        }

        /* The actual pixel room image */
        #room-bg {
            display: block;
            max-width: 85vw;
            max-height: 80vh;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            position: relative;
            border-radius: 20px;
            filter: drop-shadow(0 30px 80px rgba(0, 0, 0, 0.9));
        }

        /* Invisible interactive zones */
        #hitbox-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hitbox {
            position: absolute;
            pointer-events: all;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hitbox:hover {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .hitbox::after {
            content: attr(data-label);
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 30px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .hitbox:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Sprite canvas layer — receives clicks for debug coordinate tool */
        #sprite-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* ── Widget: Recent Posts ── */
        .widget-overlay {
            position: fixed;
            bottom: 40px;
            left: 50px;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 25px;
            border-radius: 24px;
            width: 320px;
            color: var(--text-primary);
            box-shadow: var(--glass-shadow);
            animation: slide-in-left 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slide-in-left {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .widget-overlay h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--accent);
            font-weight: 800;
        }

        .recent-post-item {
            display: block;
            text-decoration: none;
            color: var(--text-primary);
            margin-bottom: 15px;
            font-size: 0.95rem;
            transition: all 0.2s;
            border-left: 2px solid rgba(255, 113, 91, 0.1);
            padding-left: 15px;
            font-weight: 500;
        }

        .recent-post-item:hover {
            color: #fff;
            border-left-color: var(--accent);
            transform: translateX(5px);
        }

        .recent-post-item span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 400;
        }

        /* Footer / Social links */
        footer#main-footer {
            position: fixed;
            bottom: 40px;
            right: 50px;
            z-index: 100;
            display: flex;
            gap: 1.5rem;
        }

        footer#main-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        footer#main-footer a:hover {
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            header#main-header { padding: 1.5rem; flex-direction: column; gap: 1rem; }
            .brand h1 { font-size: 1.8rem; }
            nav#top-nav { gap: 1rem; }
            .widget-overlay { display: none; }
        }

        /* ── Sidebar: Persistent Navigation ── */
        .side-nav {
            position: fixed;
            left: 50px;
            top: 180px;
            bottom: 40px;
            width: 280px;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--glass-shadow);
            overflow-y: auto;
            pointer-events: auto;
            animation: fade-in-left 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fade-in-left {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .nav-group {
            margin-bottom: 35px;
        }

        .nav-group h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
            font-weight: 800;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li {
            margin-bottom: 12px;
        }

        .nav-links .nav-link {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
            display: block;
        }

        .nav-links .nav-link:hover {
            color: #fff;
            transform: translateX(5px);
        }

        .tag-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag-list li {
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-list li:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            color: #fff;
        }

        .tag-list.secondary li {
            font-size: 0.75rem;
            opacity: 0.7;
        }

        /* Adjust Recent Posts Widget to move below Sidebar if needed, 
           but let's stack them or move it to the right. 
           User specified "fill empty space", sidebar fills left. 
           Recent Finds fills bottom-left. Let's move Recent Finds to bottom-right or stack. */
        .widget-overlay {
            left: auto;
            right: 50px;
            bottom: 100px;
        }
    </style>
</head>

<body>

    <header id="main-header">
        <div class="brand">
            <h1>KH<span>MURAKAMI</span></h1>
            <p>Developer & Creative</p>
        </div>
        <nav id="top-nav">
            <a href="index.html" class="active">Home</a>
            <a href="blog.html">Blog</a>
            <a href="#projects">Projects</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <!-- New: Persistent Side Navigation -->
    <aside id="side-nav" class="side-nav">
        <div class="side-nav-content">
            <section class="nav-group">
                <h3>Explore</h3>
                <ul class="nav-links">
                    <li><a href="blog.html" class="nav-link">All Posts</a></li>
                    <li><a href="#projects" class="nav-link">Projects Hub</a></li>
                    <li><a href="#about" class="nav-link">My Story</a></li>
                </ul>
            </section>

            <section class="nav-group">
                <h3>Categories</h3>
                <ul id="sidebar-categories" class="tag-list">
                    <!-- Categories injected via JS -->
                    <li class="loading">Loading...</li>
                </ul>
            </section>

            <section class="nav-group">
                <h3>Tags</h3>
                <ul id="sidebar-tags" class="tag-list secondary">
                    <!-- Tags injected via JS -->
                </ul>
            </section>
        </div>
    </aside>

    <!-- Layer 1: Full-screen parallax forest background -->
    <div id="bg-forest"></div>

    <!-- Layer 2: Vignette darkening at the edges -->
    <div id="vignette"></div>

    <!-- Layer 3: The cozy room floating in the center -->
    <div id="game-container">
        <img id="room-bg" src="assets/night_background_github_page.jpg" alt="Cozy pixel art portfolio room" />

        <!-- Interactive hitboxes -->
        <div id="hitbox-layer">
            <div class="hitbox" data-action="about" data-label="📖 About Me"
                style="left:12%; top:22%; width:14%; height:30%;"></div>
            <div class="hitbox" data-action="resume" data-label="📄 Resume"
                style="left:38%; top:5%;  width:14%; height:50%;"></div>
            <div class="hitbox" data-action="projects" data-label="🕹️ Projects"
                style="left:60%; top:5%;  width:25%; height:30%;"></div>
            <div class="hitbox" data-action="contact" data-label="✉️ Contact"
                style="left:73%; top:35%; width:15%; height:40%;"></div>
        </div>

        <!-- Sprite canvas (future walking character) -->
        <canvas id="sprite-canvas"></canvas>
    </div>

    <!-- Recent Posts Widget Overlay -->
    <div id="recent-posts-widget" class="widget-overlay">
        <h3>Recent Finds</h3>
        <div id="recent-posts-container">
            <!-- Posts injected via js/main.js -->
        </div>
    </div>

    <footer id="main-footer">
        <a href="#" title="GitHub">GH</a>
        <a href="#" title="LinkedIn">LI</a>
        <a href="#" title="Twitter">TW</a>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>

</html>
