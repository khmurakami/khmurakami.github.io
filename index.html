<style>
    :root {
        --ink: #f6e7d4;
        --shadow: rgba(35, 18, 48, 0.72);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        /* No double-tap zoom, no rubber-band scroll, no text selection drag:
           every one of those steals a gesture the game needs. */
        touch-action: manipulation;
        overscroll-behavior: none;
        background: #2a1836;   /* matches the darkest tone of the plate */
    }

    body {
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        color: var(--ink);
    }

    #game {
        display: block;
        width: 100vw;

        /*
          100vh, then 100dvh.

          On mobile Safari and Chrome `100vh` is the LARGE viewport height — the
          height the page would have if the URL bar were hidden — so a canvas
          sized with it runs underneath the browser chrome and the bottom of the
          world is cut off. `100dvh` is the height actually visible right now.

          The 100vh line stays as the fallback for browsers without dvh; the
          second declaration simply wins where it is supported.
        */
        height: 100vh;
        height: 100dvh;

        /*
          The canvas backing store is in CSS pixels, so on a high-DPI screen the
          BROWSER performs the last step of the upscale to device pixels. Left
          to itself it does that with bilinear smoothing, which would blur away
          the entire point of rendering into a low-resolution buffer.

          `pixelated` makes that final step nearest-neighbour too, so the chain
          is integer and hard-edged from the render buffer all the way to the
          glass. `crisp-edges` is the older spelling, kept for Firefox.
        */
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    /* -- Boot: the building waking up -- */
    #boot {
        position: fixed;
        inset: 0;
        /* Above the panels, which sit at 50. Nothing should ever be able to
           paint over the boot screen, and tying on z-index would leave that
           decided by DOM order. */
        z-index: 100;
        display: grid;
        place-items: center;
        /* The night sky's own colour, so the reveal is a fade between two
           versions of the same dark rather than a flash. */
        background: radial-gradient(120% 90% at 50% 42%, #1c2350 0%, #141a3a 55%, #0d1028 100%);
        opacity: 1;
        transition: opacity 620ms ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot[hidden] { display: none; }

    .boot-inner { display: grid; justify-items: center; gap: 1.15rem; padding: 2rem; }

    .boot-title {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(0.95rem, 2.1vw, 1.3rem);
        letter-spacing: 0.62em;
        /* Letter-spacing pads the right side only; this re-centres the word. */
        text-indent: 0.62em;
        text-transform: uppercase;
        color: #ffd9a0;
        opacity: 0.92;
    }

    /* The bar is a row of windows. They light warm, in order, as the world's
       image slots settle — the same thing the skyline does all night. */
    .boot-bar {
        display: flex;
        gap: 3px;
        padding: 5px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.3);
        box-shadow: inset 0 0 0 1px rgba(255, 214, 160, 0.12);
    }
    .boot-cell {
        width: 7px;
        height: 13px;
        border-radius: 1px;
        background: rgba(150, 170, 230, 0.13);
        transition: background 260ms ease, box-shadow 260ms ease;
    }
    .boot-cell.lit {
        background: #ffc978;
        box-shadow: 0 0 7px rgba(255, 190, 120, 0.75);
    }

    .boot-status {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.74rem;
        letter-spacing: 0.14em;
        opacity: 0.5;
    }
    #boot.failed .boot-status { opacity: 0.9; color: #ffb0a0; }

    /* Diegetic prompt — styled like warm light on paper, not browser chrome. */
    #door-prompt {
        position: fixed;
        left: 50%;
        bottom: 8vh;
        transform: translate(-50%, 12px);
        padding: 0.7rem 1.6rem;
        border-radius: 999px;
        background: var(--shadow);
        border: 1px solid rgba(246, 231, 212, 0.22);
        backdrop-filter: blur(6px);
        font-size: clamp(0.9rem, 1.6vw, 1.15rem);
        letter-spacing: 0.06em;
        white-space: nowrap;
        box-shadow: 0 0 28px rgba(255, 170, 90, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms ease, transform 220ms ease;
    }

    #door-prompt.visible {
        opacity: 1;
        transform: translate(-50%, 0);
        /* Only clickable once it is actually showing, or an invisible pill
           swallows taps aimed at the roof behind it. */
        pointer-events: auto;
    }

    #door-prompt {
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
    }

    /* On touch the prompt IS the interact button, so it needs to look like
       something you can press and be big enough to hit. */
    body.touch #door-prompt.visible {
        cursor: pointer;
        padding: 0.95rem 1.9rem;
        border-color: rgba(255, 214, 160, 0.5);
        background: rgba(46, 26, 60, 0.88);
    }
    body.touch #door-prompt.visible:active {
        transform: translate(-50%, 1px);
        background: rgba(66, 40, 82, 0.92);
    }

    /* ── The control panel ───────────────────────────────────────
       Sits on its own ground rather than floating on the artwork. The roof is
       a busy, low-contrast night scene and text laid straight onto it competes
       with every lit window behind it; a panel is what lets the type be quiet
       and still legible. */
    #hud {
        position: fixed;
        left: 50%;
        bottom: 2.2vh;
        transform: translateX(-50%);
        z-index: 20;

        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;

        padding: 0.85rem 1.5rem 0.95rem;
        border-radius: 14px;
        background: rgba(18, 12, 30, 0.62);
        border: 1px solid rgba(246, 231, 212, 0.14);
        backdrop-filter: blur(9px);
        -webkit-backdrop-filter: blur(9px);
        box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45);

        pointer-events: none;
        user-select: none;
        max-width: min(92vw, 46rem);
        transition: opacity 400ms ease;
    }

    /* Hierarchy: one sentence that says what to do, then the keys that do it.
       The old line gave both the same weight, so it read as a list of five
       equal facts rather than an instruction with a footnote. */
    .hud-lede {
        font-size: clamp(0.86rem, 1.5vw, 1rem);
        letter-spacing: 0.01em;
        opacity: 0.9;
        text-align: center;
    }

    .hud-keys {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.35rem 1.15rem;
        list-style: none;
        font-size: clamp(0.68rem, 1.15vw, 0.8rem);
    }

    .hud-keys li {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        opacity: 0.72;
    }

    .hud-keys span { letter-spacing: 0.02em; }

    /* Keys look like keys. A glyph in a bordered cap is read as "press this"
       without being told, which is the whole argument for iconography over
       another word. */
    .hud-keys kbd {
        display: inline-grid;
        place-items: center;
        min-width: 1.5em;
        height: 1.5em;
        padding: 0 0.32em;
        border-radius: 5px;
        border: 1px solid rgba(246, 231, 212, 0.34);
        border-bottom-width: 2px;
        background: rgba(246, 231, 212, 0.10);
        font: inherit;
        font-size: 0.94em;
        line-height: 1;
        color: var(--ink);
    }

    .hud-keys kbd + kbd { margin-left: -0.2rem; }

    /* Out of the way once somebody is clearly playing. Faded, not removed —
       it comes back on the next keypress, and a control panel that vanishes
       permanently is one you cannot check. */
    #hud.idle { opacity: 0.22; }

    /* On touch there are no keys to show, so the panel becomes the one line
       that is actually true there. `world-main.js` swaps the contents. */
    body.touch .hud-keys { display: none; }
    body.touch #hud { padding: 0.7rem 1.3rem; }

    @media (max-width: 30rem) {
        .hud-keys { gap: 0.3rem 0.7rem; }
        #hud { padding: 0.7rem 1rem 0.8rem; border-radius: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
        #hud { transition: none; }
    }

    /* -- Panels: lit paper against the night, not browser chrome -- */
    .panel-root[hidden] { display: none; }

    .panel-root {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 50;
    }

    .panel-scrim {
        position: absolute;
        inset: 0;
        background: rgba(8, 10, 28, 0.62);
        backdrop-filter: blur(3px);
        opacity: 0;
        transition: opacity 200ms ease;
    }
    .panel-root.open .panel-scrim { opacity: 1; }

    .panel {
        position: relative;
        width: min(680px, 92vw);
        max-height: 82vh;
        display: flex;
        flex-direction: column;
        border-radius: 10px;
        background: linear-gradient(180deg, #22203a 0%, #1b1930 100%);
        border: 1px solid rgba(255, 214, 170, 0.22);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6),
                    0 0 60px rgba(255, 180, 110, 0.10);
        transform: translateY(14px) scale(0.985);
        opacity: 0;
        transition: transform 220ms cubic-bezier(.2,.8,.2,1), opacity 200ms ease;
    }
    .panel-root.open .panel { transform: none; opacity: 1; }

    .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.9rem 1.2rem;
        border-bottom: 1px solid rgba(255, 214, 170, 0.14);
    }
    .panel-title {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #ffe6c4;
    }
    .panel-close {
        font: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 214, 170, 0.22);
        border-radius: 999px;
        padding: 0.28rem 0.7rem;
        cursor: pointer;
    }
    .panel-close:hover { background: rgba(255, 255, 255, 0.12); }

    .panel-body {
        padding: 1.1rem 1.2rem 1.4rem;
        overflow-y: auto;
        line-height: 1.6;
        font-size: 0.95rem;
    }
    .panel-body:focus-visible { outline: 2px solid rgba(255, 200, 140, 0.5); }

    .panel-body p { margin-bottom: 0.85rem; }
    .lede { color: #ffeed6; }
    .meta { font-size: 0.8rem; opacity: 0.62; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.9rem; }
    .chip {
        font-size: 0.72rem; letter-spacing: 0.04em;
        padding: 0.2rem 0.55rem; border-radius: 999px;
        background: rgba(255, 200, 140, 0.10);
        border: 1px solid rgba(255, 200, 140, 0.22);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
    .btn {
        font: inherit; font-size: 0.86rem;
        padding: 0.5rem 0.95rem; border-radius: 6px;
        color: var(--ink); text-decoration: none; cursor: pointer;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 214, 170, 0.24);
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); }
    .btn.primary {
        background: rgba(255, 186, 110, 0.9); color: #241a12; border-color: transparent;
        font-weight: 600;
    }

    .field { display: block; margin-bottom: 0.8rem; }
    .field span { display: block; font-size: 0.78rem; opacity: 0.7; margin-bottom: 0.3rem; }
    .field input, .field textarea {
        width: 100%; font: inherit; font-size: 0.9rem;
        padding: 0.5rem 0.65rem; border-radius: 6px; resize: vertical;
        color: var(--ink);
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 214, 170, 0.2);
    }

    .stack { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
    .stack-item {
        display: grid; gap: 0.15rem;
        padding: 0.7rem 0.85rem; border-radius: 8px;
        text-decoration: none; color: inherit;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 214, 170, 0.14);
        transition: transform 140ms ease, background 140ms ease;
    }
    .stack-item:hover { background: rgba(255, 255, 255, 0.09); transform: translateX(3px); }
    .stack-date { font-size: 0.72rem; opacity: 0.6; }
    .stack-title { font-weight: 600; color: #ffe6c4; }
    .stack-sum { font-size: 0.85rem; opacity: 0.8; }

    /* -- The workshop panels -- */

    /* The pegboard. Numbered, because the order the scripts run in is the
       content: a sheet pixelated before it is cut splits on the wrong pixels. */
    .tools { list-style: none; counter-reset: tool; margin: 0 0 1rem; }
    .tool {
        counter-increment: tool;
        position: relative;
        padding: 0 0 0.85rem 2.1rem;
        border-left: 1px solid rgba(255, 210, 150, 0.16);
        margin-left: 0.6rem;
    }
    .tool:last-child { border-left-color: transparent; padding-bottom: 0; }
    .tool::before {
        content: counter(tool);
        position: absolute; left: -0.7rem; top: 0;
        width: 1.35rem; height: 1.35rem;
        display: grid; place-items: center;
        border-radius: 50%;
        background: #2b1b30; border: 1px solid rgba(255, 210, 150, 0.3);
        font-size: 0.7rem; opacity: 0.85;
    }
    .tool code {
        display: block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.86rem; color: #ffd9a0;
    }
    .tool-what { display: block; margin-top: 0.15rem; }
    .tool-why { display: block; margin-top: 0.15rem; font-size: 0.82rem; opacity: 0.62; }

    /* The shelf. Sixty-four jars, shown as sixty-four jars — a list of hex
       codes would be the same data and none of the point. */
    .swatches {
        display: grid;
        grid-template-columns: repeat(16, 1fr);
        gap: 2px;
        margin: 0 0 1rem;
        padding: 6px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.28);
    }
    .swatch { display: block; aspect-ratio: 1; border-radius: 2px; }
    @media (max-width: 520px) { .swatches { grid-template-columns: repeat(8, 1fr); } }

    /* The plans. Figures large, labels small — it should read as a spec sheet
       pinned to a board, not as prose with numbers in it. */
    .spec {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.3rem 0.8rem;
        align-items: baseline;
        margin: 0 0 1rem;
        padding: 0.7rem 0.9rem;
        border: 1px dashed rgba(255, 210, 150, 0.22);
        border-radius: 8px;
    }
    .spec dt {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #ffd9a0; text-align: right; white-space: nowrap;
    }
    .spec dd { margin: 0; font-size: 0.85rem; opacity: 0.72; }

    /* -- The CRT variant, for the terminal -- */
    .panel-root.crt .panel {
        background: #0a1410;
        border-color: rgba(120, 255, 180, 0.28);
        box-shadow: 0 30px 90px rgba(0,0,0,.65), 0 0 70px rgba(60, 255, 150, 0.12);
    }
    .panel-root.crt .panel-title { color: #8dffc0; }
    .term {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.86rem;
        color: #86f5b4;
        text-shadow: 0 0 6px rgba(90, 255, 170, 0.45);
    }
    .term-out { max-height: 46vh; overflow-y: auto; margin-bottom: 0.5rem; }
    .term-row { white-space: pre-wrap; word-break: break-word; }
    .term-row.echoed { opacity: 0.75; }
    .term-row.err { color: #ff9d8a; }
    .term-row.dim { opacity: 0.55; }
    .term-row.motd { color: #d8ffe9; margin-bottom: 0.5rem; }
    .term-line { display: flex; gap: 0.5rem; align-items: baseline; }
    .term-prompt { flex: none; opacity: 0.85; }
    .term-in {
        flex: 1; font: inherit; color: inherit;
        background: transparent; border: none; outline: none;
        caret-color: #86f5b4;
    }

    @media (prefers-reduced-motion: reduce) {
        #door-prompt, .panel, .panel-scrim, .stack-item { transition: none; }
        #boot, .boot-cell { transition: none; }
    }
</style>
</head>
<body>
    <!--
      The boot screen is markup, not JavaScript.

      It has to be painted before the module that would otherwise create it has
      even been fetched — a loading screen built by JS cannot cover the gap it
      exists to cover, because the gap starts before the JS does.
    -->
    <div id="boot" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-inner">
            <p class="boot-title">Rooftop</p>
            <div class="boot-bar" data-boot-bar></div>
            <p class="boot-status" data-boot-status>waking the city</p>
        </div>
        <noscript>
            <p class="boot-status">This one needs JavaScript. The writing is all
            readable without it at <a href="blog.html">blog.html</a>.</p>
        </noscript>
    </div>

    <canvas id="game"></canvas>
    <div id="door-prompt" role="status" aria-live="polite" aria-hidden="true"></div>
    <!--
      The controls, as a panel rather than a line of shorthand.

      It was one string of uppercase text at 45% opacity: "← → WALK · SHIFT RUN
      · ↑ ↓ DEPTH · E INTERACT · M MUTE". Three problems with that. It was the
      lowest-contrast thing on the screen, so the one piece of text a visitor
      MUST read was the hardest to. Everything in it had the same weight, so
      there was no order to read it in. And "↑ ↓ DEPTH" is not an instruction —
      it is a note to somebody who already knows what depth means here.

      Keys are marked up as <kbd> and rewritten for touch by `world-main.js`,
      which already knows whether there is a keyboard.
    -->
    <div id="hud" role="group" aria-label="Controls">
        <p class="hud-lede" data-hud-lede>Walk around. Everything up here opens something.</p>
        <ul class="hud-keys" data-hud-keys>
            <li><kbd>←</kbd><kbd>→</kbd><span>Walk</span></li>
            <li><kbd>↑</kbd><kbd>↓</kbd><span>Further in, or nearer</span></li>
            <li><kbd>Shift</kbd><span>Run</span></li>
            <li><kbd>E</kbd><span>Open what you are next to</span></li>
            <li><kbd>M</kbd><span>Sound</span></li>
        </ul>
    </div>

    <script type="module" src="js/world-main.js"></script>
</body>
</html>
