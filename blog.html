<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Cozy Isometric Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="blog.css">
</head>
<body class="blog-page">
    <!-- Atmospheric Overlays -->
    <div id="grain-overlay"></div>
    <div id="ambient-glow"></div>

    <header id="main-header">
        <div class="brand">
            <h1>KH<span>MURAKAMI</span></h1>
            <p>Developer & Creative</p>
        </div>
        <nav id="top-nav">
            <a href="index.html">Home</a>
            <a href="blog.html" class="active">Blog</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#about">About</a>
        </nav>
    </header>

    <main class="blog-layout">
        <!-- Sidebar Navigation -->
        <aside class="blog-sidebar">
            <header class="sidebar-header">
                <div class="nav-toggle-group">
                    <button id="mode-feed" class="toggle-btn active" title="Chronological Feed">🗂️ Feed</button>
                    <button id="mode-tree" class="toggle-btn" title="Documentation Tree">📂 Tree</button>
                </div>
            </header>
            
            <div id="sidebar-feed-view" class="sidebar-content">
                <div class="sidebar-section">
                    <h3>Categories</h3>
                    <ul id="category-filters" class="blog-nav-list">
                        <li><button class="nav-btn active" data-category="all">All Stories</button></li>
                        <!-- Categories injected via JS -->
                    </ul>
                </div>
                <div class="sidebar-section">
                    <h3>Latest Finds</h3>
                    <ul id="sidebar-recent-list" class="blog-nav-list">
                        <!-- Recent posts injected via JS -->
                    </ul>
                </div>
            </div>

            <div id="sidebar-tree-view" class="sidebar-content hidden">
                <div class="sidebar-section">
                    <div class="tree-header-actions">
                        <h3>Documentation Tree</h3>
                        <div class="tree-actions">
                            <button id="add-folder-btn" class="action-icon-btn" title="New Folder">➕📁</button>
                            <button id="add-page-btn" class="action-icon-btn" title="New Page">➕📄</button>
                        </div>
                    </div>
                    <div id="doc-tree-container" class="doc-tree">
                        <!-- Tree structure injected via JS -->
                        <div class="empty-state">Building tree...</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Primary Content Area -->
        <section class="blog-main">
            <div id="post-list" class="post-feed">
                <!-- Post previews will be injected here -->
            </div>
            
            <!-- Centered Page Canvas for Post Detail -->
            <div id="post-detail" class="post-canvas-wrapper hidden">
                <article class="post-canvas">
                    <header class="post-header">
                        <button id="back-to-list" class="back-link">← Back to feed</button>
                        <div class="post-top-meta">
                            <span id="post-meta-top" class="post-meta"></span>
                            <span id="post-status-badge" class="status-badge hidden">Verified</span>
                        </div>
                        <h1 id="post-title-display"></h1>
                    </header>
                    <div id="post-body" class="post-content">
                        <!-- Markdown content will be rendered here -->
                    </div>
                    <footer class="post-footer">
                        <div id="post-tags-display" class="post-tags"></div>
                    </footer>
                </article>
            </div>
        </section>

        <!-- Right Exploration Panel (Optional/Future use) -->
        <aside class="blog-exploration">
            <div class="search-box">
                <input type="text" id="blog-search" placeholder="Search insights...">
            </div>
            <div class="exploration-section">
                <h3>About the Blog</h3>
                <p>A dedicated space for programming tutorials, creative experiments, and digital finds.</p>
            </div>
        </aside>
    </main>

    <script src="lib/marked.min.js"></script>
    <script type="module" src="js/blog.js"></script>
</body>
</html>
